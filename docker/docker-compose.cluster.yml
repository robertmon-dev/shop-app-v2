# Optional 3-node RabbitMQ cluster behind HAProxy, replacing the single
# `rabbitmq` service from the root compose file.
#
#   docker compose -f docker-compose.yml -f docker/docker-compose.cluster.yml up -d
#
# The cluster is held together by RABBITMQ_ERLANG_COOKIE (from .env), not by a
# mounted .erlang.cookie file.

x-rabbit: &rabbit
  image: rabbitmq:3-management
  environment: &rabbit-env
    RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-shop-on-rails-local}
  volumes:
    - ./docker/entrypoint.sh:/usr/local/bin/cluster-entrypoint.sh:ro
  entrypoint: /usr/local/bin/cluster-entrypoint.sh
  networks:
    - rabbitmq

services:
  rabbitmq:
    profiles: ["disabled"]

  rabbitmq1:
    <<: *rabbit
    hostname: rabbitmq1
    environment:
      <<: *rabbit-env
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST:-/}
    volumes:
      - ./docker/entrypoint.sh:/usr/local/bin/cluster-entrypoint.sh:ro
      - rabbitmq1_data:/var/lib/rabbitmq

  rabbitmq2:
    <<: *rabbit
    hostname: rabbitmq2
    depends_on: [rabbitmq1]
    environment:
      <<: *rabbit-env
      JOIN_CLUSTER_HOST: rabbitmq1
    volumes:
      - ./docker/entrypoint.sh:/usr/local/bin/cluster-entrypoint.sh:ro
      - rabbitmq2_data:/var/lib/rabbitmq

  rabbitmq3:
    <<: *rabbit
    hostname: rabbitmq3
    depends_on: [rabbitmq1]
    environment:
      <<: *rabbit-env
      JOIN_CLUSTER_HOST: rabbitmq1
    volumes:
      - ./docker/entrypoint.sh:/usr/local/bin/cluster-entrypoint.sh:ro
      - rabbitmq3_data:/var/lib/rabbitmq

  haproxy:
    image: haproxy:2.9-alpine
    volumes:
      - ./docker/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on: [rabbitmq1, rabbitmq2, rabbitmq3]
    ports:
      - "${RABBITMQ_DEFAULT_PORT:-5673}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15673}:15672"
    networks:
      - rabbitmq

networks:
  rabbitmq:

volumes:
  rabbitmq1_data:
  rabbitmq2_data:
  rabbitmq3_data:
