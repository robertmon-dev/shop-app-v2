default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  host: <%= ENV.fetch("POSTGRES_HOST", "localhost") %>
  port: <%= ENV.fetch("POSTGRES_PORT", 5433) %>
  username: <%= ENV.fetch("POSTGRES_USER", "postgres") %>
  password: <%= ENV.fetch("POSTGRES_PASSWORD", "postgres") %>

development:
  <<: *default
  database: <%= ENV.fetch("POSTGRES_DB", "shop_on_rails_development") %>

test:
  <<: *default
  database: <%= ENV.fetch("POSTGRES_TEST_DB", "shop_on_rails_test") %>

production:
  primary: &primary_production
    <<: *default
    database: <%= ENV.fetch("POSTGRES_DB", "shop_on_rails_production") %>
    username: <%= ENV.fetch("POSTGRES_USER", "shop_on_rails") %>
    password: <%= ENV.fetch("SHOP_ON_RAILS_DATABASE_PASSWORD", nil) %>
  cache:
    <<: *primary_production
    database: <%= ENV.fetch("POSTGRES_DB", "shop_on_rails_production") %>_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: <%= ENV.fetch("POSTGRES_DB", "shop_on_rails_production") %>_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: <%= ENV.fetch("POSTGRES_DB", "shop_on_rails_production") %>_cable
    migrations_paths: db/cable_migrate
