servers:
  - url: "/"
components:
  securitySchemes:
    Bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "JWT token for authentication. Use format: `Bearer <token>`"
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        mail:
          type: string
        phone:
          type: string
        role:
          type: string
          enum:
            - regular
            - moderator
            - admin
            - entrepreneur
        active:
          type: boolean
        verified:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - mail
        - active
        - verified
        - created_at
        - updated_at
    UserDetail:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        first_name:
          type: string
          nullable: true
        last_name:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - name
        - first_name
        - last_name
        - created_at
        - updated_at
    Location:
      type: object
      properties:
        id:
          type: integer
        country:
          type: string
          nullable: true
        province:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        postal_code:
          type: string
          nullable: true
        street:
          type: string
          nullable: true
        building_number:
          type: string
          nullable: true
        apartment_number:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - country
        - province
        - city
        - postal_code
        - street
        - building_number
        - apartment_number
        - created_at
        - updated_at
    EntrepreneurDetail:
      type: object
      properties:
        business_name:
          type: string
          nullable: true
        nip:
          type: string
          nullable: true
        krs:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        offer:
          type: string
          nullable: true
        industry:
          type: string
          nullable: true
        business_phone_number:
          type: string
          nullable: true
        business_mail:
          type: string
          nullable: true
        website_address:
          type: string
          nullable: true
        id:
          type: integer
        income:
          nullable: true
        costs:
          nullable: true
        funding_capital:
          nullable: true
        management_council_members:
          nullable: true
        decision_makers:
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - business_name
        - nip
        - krs
        - description
        - offer
        - industry
        - business_phone_number
        - business_mail
        - website_address
        - id
        - income
        - costs
        - funding_capital
        - management_council_members
        - decision_makers
        - created_at
        - updated_at
    UserProfile:
      allOf:
        - "$ref": "#/components/schemas/User"
      type: object
      properties:
        user_detail:
          "$ref": "#/components/schemas/UserDetail"
        locations:
          type: array
          items:
            "$ref": "#/components/schemas/Location"
        entrepreneur_detail:
          "$ref": "#/components/schemas/EntrepreneurDetail"
    UserAction:
      type: object
      properties:
        id:
          type: integer
        action_type:
          type: string
        action:
          type: string
        created_at:
          type: string
          format: date-time
      required:
        - id
        - action_type
        - action
        - created_at
    ProductPhoto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          nullable: true
        thumbnail_url:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - url
        - created_at
        - updated_at
    ProductLike:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        created_at:
          type: string
          format: date-time
      required:
        - id
        - user_id
        - created_at
    ProductComment:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        content:
          type: string
        parent_id:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        replies:
          type: array
          items:
            type: object
      required:
        - id
        - user_id
        - content
        - created_at
        - updated_at
    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        parents:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
            required:
              - id
              - name
      required:
        - id
        - name
        - parents
    Product:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        price:
          type: string
          description: Decimal serialised as a string
        average_rating:
          nullable: true
        likes_count:
          type: integer
        comments_count:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        photos:
          type: array
          items:
            "$ref": "#/components/schemas/ProductPhoto"
        likes:
          type: array
          items:
            "$ref": "#/components/schemas/ProductLike"
        comments:
          type: array
          items:
            "$ref": "#/components/schemas/ProductComment"
        categories:
          type: array
          items:
            "$ref": "#/components/schemas/Category"
      required:
        - id
        - name
        - price
        - likes_count
        - comments_count
        - photos
        - likes
        - comments
        - categories
    OrderItem:
      type: object
      properties:
        id:
          type: integer
        product_name:
          type: string
        quantity:
          type: integer
        price_at_purchase:
          type: string
          description: Decimal serialised as a string
        subtotal:
          type: string
          description: Decimal serialised as a string
      required:
        - id
        - product_name
        - quantity
        - price_at_purchase
        - subtotal
    Order:
      type: object
      properties:
