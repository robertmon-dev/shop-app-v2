  "/api/v1/stripe_payments_webhook/handle":
    post:
      summary: Handles Stripe webhook events
      tags:
        - Stripe Webhooks
      description:
        Receives and processes asynchronous events from Stripe. The request
        body should be the raw JSON payload from Stripe, and the `Stripe-Signature`
        header must be present.
      parameters:
        - name: Stripe-Signature
          in: header
          schema:
            type: string
      responses:
        "200":
          description: webhook acknowledged
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
        "400":
          description: bad request (e.g., invalid signature)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  errors:
                    type: array
                    items:
                      type: string
        "500":
          description: internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  errors:
                    type: array
                    items:
                      type: string
        "422":
          description: processing error
      requestBody:
        content:
          application/json:
            schema:
              type: object
