---
openapi: 3.0.1
info:
  title: API V1
  version: v1
paths:
  "/api/v1/auth/login":
    post:
      summary: Authenticates a user and returns a JWT
      tags:
        - Authentication
      parameters: []
      responses:
        "200":
          description: login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: JWT for subsequent requests
                  message:
                    type: string
        "202":
          description: 2FA verification required
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                required:
                  - success
        "401":
          description: invalid credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - false
                  message:
                    type: string
                  errors:
                    type: array
                    items:
                      type: string
                  data:
                    type: object
                required:
                  - success
                  - message
                  - errors
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                mail:
                  type: string
                  example: user@example.com
                password:
                  type: string
                  example: password
              required:
                - mail
                - password
  "/api/v1/auth/verify_2fa":
    post:
      summary: Verifies a 2FA code
      tags:
        - Authentication
      parameters: []
      responses:
        "200":
          description: 2FA successful, token returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
        "401":
          description: invalid 2FA code
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - false
                  message:
                    type: string
                  errors:
                    type: array
                    items:
                      type: string
                  data:
                    type: object
                required:
                  - success
                  - message
                  - errors
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                mail:
                  type: string
                  example: user@example.com
                second_factor_code:
                  type: string
                  example: "123456"
              required:
                - mail
                - second_factor_code
  "/api/v1/auth/activate":
    patch:
      summary: Activates a user account
      tags:
        - Authentication
      parameters: []
      responses:
        "200":
          description: account activated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                required:
                  - success
        "422":
          description: invalid activation code
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - false
                  message:
                    type: string
                  errors:
                    type: array
                    items:
                      type: string
                  data:
                    type: object
                required:
                  - success
                  - message
                  - errors
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                mail:
                  type: string
                  example: newuser@example.com
                activation_code:
                  type: string
                  example: ABC-123
              required:
                - mail
                - activation_code
  "/api/v1/auth/password/reset":
    post:
      summary: Requests a password reset
      tags:
        - Authentication
      parameters: []
      responses:
        "200":
          description: password reset instructions sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                required:
                  - success
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                mail:
                  type: string
                  example: user@example.com
              required:
                - mail
    patch:
      summary: Confirms a password reset
      tags:
        - Authentication
      parameters: []
      responses:
        "200":
          description: password has been reset successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                required:
                  - success
        "422":
          description: invalid code or password mismatch
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - false
                  message:
                    type: string
                  errors:
                    type: array
                    items:
                      type: string
                  data:
                    type: object
                required:
                  - success
                  - message
                  - errors
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reset_code:
                  type: string
                  example: XYZ-789
                password:
                  type: string
                  example: newPassword123
                password_confirmation:
                  type: string
                  example: newPassword123
              required:
                - reset_code
                - password
                - password_confirmation
  "/api/v1/auth/verify":
    patch:
      summary: Verifies a user account
      tags:
        - Authentication
      parameters: []
      responses:
        "200":
          description: account verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      user:
                        "$ref": "#/components/schemas/User"
                    required:
                      - user
                required:
                  - success
                  - data
        "422":
          description: invalid verification code
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - false
                  message:
                    type: string
                  errors:
                    type: array
                    items:
                      type: string
                  data:
                    type: object
                required:
                  - success
                  - message
                  - errors
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                mail:
                  type: string
                verification_code:
                  type: string
              required:
                - mail
                - verification_code
  "/api/v1/auth/request_activation_code_resend":
    post:
      summary: Resends the code (request_activation_code_resend)
      tags:
        - Authentication
      parameters: []
      responses:
        "200":
          description: code resent
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                required:
                  - success
        "404":
          description: user not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - false
                  message:
                    type: string
                  errors:
                    type: array
                    items:
                      type: string
                  data:
                    type: object
                required:
                  - success
                  - message
                  - errors
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                mail:
                  type: string
              required:
                - mail
  "/api/v1/auth/request_verification_code_resend":
    post:
      summary: Resends the code (request_verification_code_resend)
      tags:
        - Authentication
      parameters: []
      responses:
        "200":
          description: code resent
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                required:
                  - success
        "404":
          description: user not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - false
                  message:
                    type: string
                  errors:
                    type: array
                    items:
                      type: string
                  data:
                    type: object
                required:
                  - success
                  - message
                  - errors
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                mail:
                  type: string
              required:
                - mail
  "/api/v1/auth/request_2fa_code_resend":
    post:
      summary: Resends the code (request_2fa_code_resend)
      tags:
        - Authentication
      parameters: []
      responses:
        "200":
          description: code resent
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                required:
                  - success
        "404":
          description: user not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - false
                  message:
                    type: string
                  errors:
                    type: array
                    items:
                      type: string
                  data:
                    type: object
                required:
                  - success
                  - message
                  - errors
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                mail:
                  type: string
              required:
                - mail
  "/api/v1/auth/request_reset_code_resend":
    post:
      summary: Requests a new password reset code
      tags:
        - Authentication
      parameters: []
      responses:
        "200":
          description: instructions sent if the account exists
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                required:
                  - success
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                mail:
                  type: string
              required:
                - mail
  "/api/v1/cart":
    get:
      summary: Displays the current user cart
      tags:
        - Cart
      security:
        - Bearer: []
      responses:
        "200":
          description: cart displayed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    "$ref": "#/components/schemas/Cart"
                required:
                  - success
                  - data
  "/api/v1/cart/add/{product_id}":
    post:
      summary: Adds a product to the cart
      tags:
        - Cart
      security:
        - Bearer: []
      parameters:
        - name: product_id
          in: path
          format: uuid
          required: true
          description: ID of the product to add
          schema:
            type: string
      responses:
        "200":
          description: product added, cart returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    "$ref": "#/components/schemas/Cart"
                required:
                  - success
                  - data
        "422":
          description: invalid quantity
        "404":
          description: product not found
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                quantity:
                  type: integer
                  example: 1
                  description: Quantity to add
              required:
                - quantity
  "/api/v1/cart/revoke/{item_id}":
    delete:
      summary: Removes an item from the cart
      tags:
        - Cart
      security:
        - Bearer: []
      parameters:
        - name: item_id
          in: path
          required: true
          description: ID of the cart item to remove
          schema:
            type: integer
      responses:
        "200":
          description: item removed, cart returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    "$ref": "#/components/schemas/Cart"
                required:
                  - success
                  - data
        "404":
          description: item not found
  "/api/v1/cart/clear":
    delete:
      summary: Clears all items from the cart
      tags:
        - Cart
      security:
        - Bearer: []
      responses:
        "200":
          description: cart cleared, empty cart returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    "$ref": "#/components/schemas/Cart"
                required:
                  - success
                  - data
  "/api/v1/categories":
    get:
      summary: Lists categories
      tags:
        - Categories
      security:
        - Bearer: []
      responses:
        "200":
          description: returns all categories
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      categories:
                        type: array
                        items:
                          "$ref": "#/components/schemas/Category"
                    required:
                      - categories
                required:
                  - success
                  - data
    post:
      summary: Creates a category (Admin only)
      tags:
        - Categories
      security:
        - Bearer: []
      parameters: []
      responses:
        "201":
          description: category created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      category:
                        "$ref": "#/components/schemas/Category"
                    required:
                      - category
                required:
                  - success
                  - data
        "403":
          description: forbidden for a regular user
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - false
                  message:
                    type: string
                  errors:
                    type: array
                    items:
                      type: string
                  data:
                    type: object
                required:
                  - success
                  - message
                  - errors
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CategoryInput"
  "/api/v1/categories/{id}":
    parameters:
      - name: id
        in: path
        format: uuid
        required: true
        schema:
          type: string
    patch:
      summary: Updates a category (Admin only)
      tags:
        - Categories
      security:
        - Bearer: []
      parameters: []
      responses:
        "200":
          description: category updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      category:
                        "$ref": "#/components/schemas/Category"
                    required:
                      - category
                required:
                  - success
                  - data
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CategoryInput"
    delete:
      summary: Deletes a category (Admin only)
      tags:
        - Categories
      security:
        - Bearer: []
      responses:
        "204":
          description: category deleted
  "/api/v1/diagnostics/readiness":
    get:
      summary: Checks if the application is ready to serve traffic
      tags:
        - Diagnostics
      responses:
        "200":
          description: application is ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Application is ready.
                  details:
                    type: object
                    properties:
                      database:
                        type: string
                        example: ok
        "503":
          description: application is not ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Application is not ready.
                  errors:
                    type: array
                    items:
                      type: string
                  details:
                    type: object
                    properties:
                      database:
                        type: string
                        example: error
  "/api/v1/diagnostics/health":
    get:
      summary: Checks the ongoing health of the application
      tags:
        - Diagnostics
      responses:
        "200":
          description: application is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Application is healthy.
                  details:
                    type: object
                    properties:
                      database:
                        type: string
                        example: ok
                      redis:
                        type: string
                        example: ok
  "/api/v1/diagnostics/metrics":
    get:
      summary: Exposes application metrics in Prometheus format
      tags:
        - Diagnostics
      responses:
        "200":
          description: metrics returned
          content:
            text/plain:
              schema:
                type: string
  "/api/v1/invoices":
    get:
      summary: Lists invoices (all for an admin, own otherwise)
      tags:
        - Invoices
      security:
        - Bearer: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: returns a paginated list of invoices
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      invoices:
                        type: array
                        items:
                          "$ref": "#/components/schemas/Invoice"
                    required:
                      - invoices
                  meta:
                    "$ref": "#/components/schemas/Meta"
                required:
                  - success
                  - data
                  - meta
        "401":
          description: unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - false
                  message:
                    type: string
                  errors:
                    type: array
                    items:
                      type: string
                  data:
                    type: object
                required:
                  - success
                  - message
                  - errors
  "/api/v1/invoices/me":
    get:
      summary: Lists the current user's invoices
      tags:
        - Invoices
      security:
        - Bearer: []
      responses:
        "200":
          description: returns own invoices
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      invoices:
                        type: array
                        items:
                          "$ref": "#/components/schemas/Invoice"
                    required:
                      - invoices
                  meta:
                    "$ref": "#/components/schemas/Meta"
                required:
                  - success
                  - data
                  - meta
  "/api/v1/invoices/{id}":
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      summary: Retrieves an invoice
      tags:
        - Invoices
      security:
        - Bearer: []
      responses:
        "200":
          description: returns the invoice
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      invoice:
                        "$ref": "#/components/schemas/Invoice"
                    required:
                      - invoice
                required:
                  - success
                  - data
        "403":
          description: forbidden for another user's invoice
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - false
                  message:
                    type: string
                  errors:
                    type: array
                    items:
                      type: string
                  data:
                    type: object
                required:
                  - success
                  - message
                  - errors
  "/api/v1/invoices/{id}/download":
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      summary: Downloads the invoice as a base64 encoded PDF
      tags:
        - Invoices
      security:
        - Bearer: []
      responses:
        "200":
          description: returns the rendered PDF
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    "$ref": "#/components/schemas/InvoiceDownload"
                required:
                  - success
                  - data
  "/api/v1/n8n_webhook/handle":
    post:
      summary: Receives shipment events from n8n
      tags:
        - Webhooks
      parameters:
        - name: X-N8N-Signature
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: order updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      order_id:
                        type: integer
                    required:
                      - order_id
                required:
                  - success
                  - data
        "401":
          description: invalid signature
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - false
                  message:
                    type: string
                  errors:
                    type: array
                    items:
                      type: string
                  data:
                    type: object
                required:
                  - success
                  - message
                  - errors
        "422":
          description: unsupported event
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - false
                  message:
                    type: string
                  errors:
                    type: array
                    items:
                      type: string
                  data:
                    type: object
                required:
                  - success
                  - message
                  - errors
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                event:
                  type: string
                order_id:
                  type: integer
                tracking_id:
                  type: string
                shipping_service_id:
                  type: string
                notes:
                  type: string
              required:
                - event
                - order_id
  "/api/v1/orders":
    get:
      summary: Lists orders
      tags:
        - Orders
      security:
        - Bearer: []
      responses:
        "200":
          description: returns only own orders
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      orders:
                        type: array
                        items:
                          "$ref": "#/components/schemas/Order"
                    required:
                      - orders
                required:
                  - success
                  - data
    post:
      summary: Creates an order from cart items
      tags:
        - Orders
      security:
        - Bearer: []
      parameters: []
      responses:
        "201":
          description: order created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      order:
                        "$ref": "#/components/schemas/Order"
                    required:
                      - order
                required:
                  - success
                  - data
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                order:
                  type: object
                  properties:
                    cart_item_ids:
                      type: array
                      items:
                        type: integer
  "/api/v1/orders/me":
    get:
      summary: Lists current user's orders
      tags:
        - Orders
      security:
        - Bearer: []
      responses:
        "200":
          description: returns current user orders
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      orders:
                        type: array
                        items:
                          "$ref": "#/components/schemas/Order"
                    required:
                      - orders
                required:
                  - success
                  - data
  "/api/v1/orders/{id}":
    get:
      summary: Retrieves a single order
      tags:
        - Orders
      security:
        - Bearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: returns the requested order
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      order:
                        "$ref": "#/components/schemas/Order"
                    required:
                      - order
                required:
                  - success
                  - data
        "403":
          description: forbidden
    put:
