        payment_status:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        items:
          type: array
          items:
            "$ref": "#/components/schemas/OrderItem"
      required:
        - id
        - user_id
        - total_amount
        - status
        - payment_status
        - created_at
        - updated_at
        - items
    Payment:
      type: object
      properties:
        id:
          type: integer
        order_id:
          type: integer
        amount:
          type: string
          description: Decimal serialised as a string
        currency:
          type: string
        status:
          type: string
        payment_method:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        order:
          "$ref": "#/components/schemas/Order"
      required:
        - id
        - order_id
        - amount
        - currency
        - status
        - created_at
        - updated_at
    Refund:
      type: object
      properties:
        id:
          type: integer
        order_id:
          type: integer
        user_id:
          type: integer
        status:
          type: string
        payment_status:
          type: string
        reason:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        refund_date:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - order_id
        - user_id
        - status
        - payment_status
        - reason
        - description
        - refund_date
        - created_at
        - updated_at
    InvoiceItem:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        quantity:
          type: integer
        unit_of_measure:
          type: string
          nullable: true
        net_price:
          type: string
          description: Decimal serialised as a string
        vat_rate:
          type: string
          description: Decimal serialised as a string
        total_net_price:
          type: string
          description: Decimal serialised as a string
        total_vat_price:
          type: string
          description: Decimal serialised as a string
        total_gross_price:
          type: string
          description: Decimal serialised as a string
      required:
        - id
        - name
        - quantity
        - unit_of_measure
        - net_price
        - vat_rate
        - total_net_price
        - total_vat_price
        - total_gross_price
    Invoice:
      type: object
      properties:
        id:
          type: integer
        invoice_number:
          type: string
        order_id:
          type: integer
        payment_id:
          type: integer
          nullable: true
        buyer_name:
          type: string
          nullable: true
        buyer_tax_id:
          type: string
          nullable: true
        full_address:
          type: string
          nullable: true
        sale_date:
          type: string
          nullable: true
        due_date:
          type: string
          nullable: true
        total_net:
          type: string
          description: Decimal serialised as a string
        tax_value:
          type: string
          description: Decimal serialised as a string
        total_gross:
          type: string
          description: Decimal serialised as a string
        url:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        items:
          type: array
          items:
            "$ref": "#/components/schemas/InvoiceItem"
      required:
        - id
        - invoice_number
        - order_id
        - payment_id
        - buyer_name
        - buyer_tax_id
        - full_address
        - sale_date
        - due_date
        - total_net
        - tax_value
        - total_gross
        - url
        - created_at
        - items
    CartItem:
      type: object
      properties:
        item_id:
          type: integer
        quantity:
          type: integer
        price_at_purchase:
          type: string
          description: Decimal serialised as a string
        subtotal:
          type: string
          description: Decimal serialised as a string
        product:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
          required:
            - id
            - name
      required:
        - item_id
        - quantity
        - price_at_purchase
        - subtotal
        - product
    InvoiceDownload:
      type: object
      properties:
        filename:
          type: string
        content_type:
          type: string
        pdf:
          type: string
          description: Base64 PDF
      required:
        - filename
        - content_type
        - pdf
    CategoryInput:
      type: object
      properties:
        category:
          type: object
          properties:
            name:
              type: string
            parent_id:
              type: string
              nullable: true
          required: []
      required:
        - category
    Cart:
      type: object
      properties:
        total_amount:
          type: string
          description: Decimal serialised as a string
        items_count:
          type: integer
        items:
          type: array
          items:
            "$ref": "#/components/schemas/CartItem"
      required:
        - total_amount
        - items_count
        - items
    Meta:
      type: object
      properties:
        current_page:
          type: integer
        next_page:
          type: integer
          nullable: true
        prev_page:
          type: integer
          nullable: true
        total_pages:
          type: integer
        total_count:
          type: integer
      required:
        - current_page
        - next_page
        - prev_page
        - total_pages
        - total_count
